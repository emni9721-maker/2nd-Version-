name: Android APK Build

on:
  push:
    branches: [ '**' ]
  pull_request:
    branches: [ '**' ]
  workflow_dispatch:

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Restore Keystore and Environment Config
        run: |
          echo "Setting up permissions..."
          find . -name "gradlew" -exec chmod +x {} + || true

          echo "Restoring debug.keystore..."
          if [ ! -f "debug.keystore" ] || [ ! -s "debug.keystore" ]; then
            if [ -f "debug.keystore.base64" ]; then
              base64 -d debug.keystore.base64 > debug.keystore 2>/dev/null || true
            fi
            if [ ! -f "debug.keystore" ] || [ ! -s "debug.keystore" ]; then
              echo "Generating valid fallback debug.keystore..."
              keytool -genkey -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
            fi
          fi

          echo "Checking .env file..."
          if [ ! -f ".env" ] && [ -f ".env.example" ]; then
            cp .env.example .env
            echo "Copied .env.example to .env"
          fi

      - name: Build Android APK with Gradle
        run: |
          echo "Building Android Debug APK..."
          ./gradlew assembleDebug --stacktrace --no-daemon -Dorg.gradle.workers.max=2

      - name: Locate and list generated APKs
        run: |
          echo "Listing generated APK files:"
          find . -type f -name "*.apk" -print

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ZERO-Android-APK
          path: 'app/build/outputs/apk/debug/*.apk'
          if-no-files-found: error
          retention-days: 30
